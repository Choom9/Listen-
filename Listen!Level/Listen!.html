<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listen!</title>
    <link rel="stylesheet" href="../Listen!.css" />
    <script src="Listen!.js" defer></script>
  </head>

  <body>
    <header>
    <h1>Listen!</h1>
    <div class="beschreibung">
    <p>Press PLAY and listen to the chord:</p>
    </div>
    <div>
      <label for="ccSwitch">Custom Mode !</label>
      <input id="ccSwitch" type="checkbox">
    </div>
  </header>

    <main>
      <div class="playButton">
    <button onclick="playSound()">PLAY</button>
    </div>

    <div class="coinCounter" id="coinCounter">
      <p>Coin Counter: </p>
    </div>
     <div class="akkordContainer">
    <button class="akk" data-index="0">A-Moll</button> 
    <button class="akk" data-index="1">C-Dur</button>
    <button class="akk" data-index="2">D-Dur</button>
    <div id= "dMollAkk" class="akk" data-index="3"></div>
    <div id= "eMollAkk" class="akk" data-index="4"></div>
    <div id= "fDurAkk" class="akk" data-index="5"></div>
    <div id= "gDurAkk" class="akk" data-index="6"></div>
   </div>

    <div class="ergebnisButton">
    <p id="checkAntwort"></p>
    </div>
  </main>
  </body>

</html>
