<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listen!</title>
    <link rel="stylesheet" href="Listen!.css" />
    <script src="Listen!Custom.js" defer></script>

  <body>
    <header>
    <h1>Listen!</h1>
    <div class="beschreibung">
    <p>Press PLAY and listen to the fucking chord:</p>
    </div>
    <div>
      <label for="ccSwitch">Uncheck for Play-Mode</label> 
      <input id="ccSwitch" type="checkbox">
    </div>
    <div>
      <p>Choose your chord
      </p>
      <div id="popUp">
       <label>A-Moll<input type="checkbox" id= "aMollCheckBox"></label>
       <label>C-Dur<input type="checkbox" id= "cDurCheckBox"></label>
       <label>D-Dur<input type="checkbox" id= "dDurCheckBox"></label>
       <label>D-Moll<input type="checkbox" id= "dMollCheckBox"></label>
       <label>E-Moll<input type="checkbox" id= "eMollCheckBox"></label>
       <label>F-Dur<input type="checkbox" id= "fDurCheckBox"></label>
       <label>G-Dur<input type="checkbox" id= "gDurCheckBox"></label>
       

      </div>
    </div>
  </header>

    <main>
      <div class="playButton">
    <button onclick="playSound()">FuckU</button>
    </div>

    <div class="coinCounter" id="coinCounter">
      <p>Coin Counter: </p>
    </div>
     <div id = "akkContainer" class="akkordContainer">
    <div id= "aMollAkk" ></div>
    <div id= "cDurAkk" ></div>
    <div id= "dDurAkk" ></div>
    <div id= "dMollAkk" ></div>
    <div id= "eMollAkk" ></div>
    <div id= "fDurAkk" ></div>
    <div id= "gDurAkk" ></div>
   </div>

    <div class="ergebnisButton">
    <p id="checkAntwort"></p>
    </div>
    <div id="tester"></div>
  </main>
  </body>

</html>
